<title>Aura Farming 101</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#F4F5F7; --surface-hover:#EBEDF0;
  --border:#E2E4E8; --border-strong:#CDD1D8;
  --ink:#1E222A; --ink-2:#565C68; --ink-muted:#8C919C; --ink-faint:#B4B8C0;
  --accent:#33415E; --accent-ink:#FFFFFF; --accent-soft:#E4E8EF;
  --gold:#B8863E; --gold-soft:#F2E6D0; --gold-ink:#5B4321;
  --ember:#BD5B33; --ember-soft:#F3E0D5;
  --danger:#A8433F; --danger-soft:#F5DEDC;
  --cat-learning:#427AC1; --cat-fitness:#D57957; --cat-health:#2E9E70; --cat-home:#C6903F;
  --cat-personal:#CE7295; --cat-finance:#3A7D36; --cat-productivity:#4A4392;
  --shadow-sm:0 1px 2px rgba(20,22,28,0.05), 0 1px 1px rgba(20,22,28,0.04);
  --shadow-md:0 10px 28px rgba(20,22,28,0.09), 0 2px 8px rgba(20,22,28,0.05);
  --shadow-lg:0 20px 48px rgba(20,22,28,0.16), 0 4px 14px rgba(20,22,28,0.08);
  --radius-lg:22px; --radius-md:15px; --radius-sm:10px;
  --font-display:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171C; --surface:#1D2027; --surface-2:#24272F; --surface-hover:#2B2F38;
    --border:#2C303A; --border-strong:#3B404C;
    --ink:#EDEEF1; --ink-2:#B7BBC4; --ink-muted:#82868F; --ink-faint:#565A64;
    --accent:#8CA1D1; --accent-ink:#131722; --accent-soft:#2A3245;
    --gold:#D9A55C; --gold-soft:#3B3020; --gold-ink:#F4DFB8;
    --ember:#E07A4E; --ember-soft:#3B2A20;
    --danger:#E0847F; --danger-soft:#3B2422;
    --cat-learning:#5A93D6; --cat-fitness:#C6754D; --cat-health:#3CAE7D; --cat-home:#C79447;
    --cat-personal:#D67FA0; --cat-finance:#5C9955; --cat-productivity:#7A72C9;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --shadow-md:0 10px 28px rgba(0,0,0,0.4);
    --shadow-lg:0 20px 48px rgba(0,0,0,0.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171C; --surface:#1D2027; --surface-2:#24272F; --surface-hover:#2B2F38;
  --border:#2C303A; --border-strong:#3B404C;
  --ink:#EDEEF1; --ink-2:#B7BBC4; --ink-muted:#82868F; --ink-faint:#565A64;
  --accent:#8CA1D1; --accent-ink:#131722; --accent-soft:#2A3245;
  --gold:#D9A55C; --gold-soft:#3B3020; --gold-ink:#F4DFB8;
  --ember:#E07A4E; --ember-soft:#3B2A20;
  --danger:#E0847F; --danger-soft:#3B2422;
  --cat-learning:#5A93D6; --cat-fitness:#C6754D; --cat-health:#3CAE7D; --cat-home:#C79447;
  --cat-personal:#D67FA0; --cat-finance:#5C9955; --cat-productivity:#7A72C9;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  --shadow-md:0 10px 28px rgba(0,0,0,0.4);
  --shadow-lg:0 20px 48px rgba(0,0,0,0.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ---------- layout ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:232px; flex-shrink:0; padding:28px 16px; display:flex; flex-direction:column; gap:4px;
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 12px 26px;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(155deg,var(--gold),var(--ember)); flex-shrink:0; box-shadow:var(--shadow-sm);}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.01em;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--ink-2); background:none; border:none; text-align:left; font-size:14.5px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:var(--surface-hover); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.sidebar-footer{margin-top:auto; padding:8px 12px; display:flex; flex-direction:column; gap:10px;}
.theme-switch{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px;}
.theme-switch button{flex:1; border:none; background:none; padding:6px 0; border-radius:999px; font-size:12px; color:var(--ink-muted); font-weight:600;}
.theme-switch button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}

.main{flex:1; min-width:0; padding:32px 40px 80px; max-width:1180px; margin:0 auto; width:100%;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:26px; font-weight:700; letter-spacing:-0.015em;}
.page-head p{margin:4px 0 0; color:var(--ink-muted); font-size:14px;}

.bottom-nav{display:none;}
@media (max-width: 860px){
  .sidebar{display:none;}
  .main{padding:20px 16px 96px;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around; z-index:40;
  }
  .bottom-nav button{
    display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
    color:var(--ink-muted); font-size:11px; font-weight:600; padding:4px 14px; border-radius:12px;
  }
  .bottom-nav button.active{color:var(--accent);}
}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:24px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:999px; border:1px solid transparent;
  font-weight:600; font-size:13.5px; padding:9px 17px; transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow-sm);}
.btn-primary:hover{box-shadow:var(--shadow-md);}
.btn-ghost{background:none; border-color:var(--border); color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-hover); color:var(--ink);}
.btn-danger{background:var(--danger-soft); color:var(--danger); border-color:transparent;}
.btn-danger:hover{filter:brightness(0.96);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:10px;
  background:none; border:1px solid transparent; color:var(--ink-muted);
}
.icon-btn:hover{background:var(--surface-hover); color:var(--ink);}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-2);}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.chip{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;}
.chip-gold{background:var(--gold-soft); color:var(--gold-ink);}
:root:not([data-theme="dark"]) .chip-gold{color:#7A5A26;}
.empty{padding:34px 20px; text-align:center; color:var(--ink-muted); font-size:13.5px;}
.empty svg{margin-bottom:10px; opacity:0.5;}

/* ---------- today: level header ---------- */
.level-card{display:flex; align-items:center; gap:28px; padding:26px 28px;}
.dial-wrap{position:relative; width:104px; height:104px; flex-shrink:0;}
.dial-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
.dial-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dial-level{font-family:var(--font-mono); font-weight:600; font-size:26px; line-height:1;}
.dial-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin-top:2px; font-weight:600;}
.level-info{flex:1; min-width:0;}
.level-info .top-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.level-title{font-size:19px; font-weight:700;}
.xp-total{font-family:var(--font-mono); font-size:13px; color:var(--ink-muted); font-weight:500;}
.xp-total b{color:var(--gold); font-weight:600;}
.xp-track{position:relative; height:11px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border);}
.xp-fill{position:absolute; inset:0 auto 0 0; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--ember)); transition:width 0.7s cubic-bezier(.2,.8,.2,1);}
.xp-caption{display:flex; justify-content:space-between; margin-top:7px; font-size:11.5px; color:var(--ink-muted); font-family:var(--font-mono);}

.xp-float{position:fixed; z-index:200; pointer-events:none; text-align:center; animation:xpfloat 1.3s ease-out forwards;}
.xp-float-amt{font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--gold); white-space:nowrap;}
.xp-float-sub{font-size:10px; font-weight:600; color:var(--ink-muted); white-space:nowrap; margin-top:1px; letter-spacing:.02em;}
@keyframes xpfloat{ 0%{opacity:0; transform:translate(-50%,4px) scale(.9);} 15%{opacity:1; transform:translate(-50%,-6px) scale(1);} 100%{opacity:0; transform:translate(-50%,-54px) scale(1);} }

/* ---------- stat row ---------- */
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px;}
.stat-tile{padding:18px 20px; display:flex; flex-direction:column; gap:8px;}
.stat-tile-top{display:flex; align-items:center; justify-content:space-between;}
.stat-tile-label{font-size:11.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
.stat-tile-value{font-family:var(--font-mono); font-size:25px; font-weight:600; letter-spacing:-0.01em;}
.mini-track{height:5px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
.mini-fill{height:100%; border-radius:999px;}
.week-trail{display:flex; gap:5px;}
.week-dot{width:15px; height:15px; border-radius:5px; background:var(--surface-2); border:1px solid var(--border);}
.week-dot.filled{background:var(--ember); border-color:var(--ember);}
.week-dot.today-ring{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border-strong);}
@media (max-width:640px){ .stat-row{grid-template-columns:1fr 1fr;} }

/* ---------- quests ---------- */
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 12px;}
.section-head h2{font-size:16.5px; font-weight:700;}
.section-head .sub{font-size:12.5px; color:var(--ink-muted); font-family:var(--font-mono);}
.group-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); margin:16px 4px 8px;}
.group-label:first-child{margin-top:4px;}
.quest-list{display:flex; flex-direction:column; gap:8px;}
.quest-item{
  display:flex; align-items:center; gap:13px; padding:13px 15px; border-radius:var(--radius-md);
  background:var(--surface); border:1px solid var(--border); transition:background .15s ease, opacity .2s ease;
}
.quest-item.done{background:var(--surface-2);}
.check-circle{
  width:25px; height:25px; border-radius:50%; border:2.2px solid var(--cat); flex-shrink:0; background:none;
  display:flex; align-items:center; justify-content:center; transition:background .15s ease, transform .15s ease;
}
.check-circle:active{transform:scale(0.88);}
.check-circle.checked{background:var(--cat); }
.quest-body{flex:1; min-width:0;}
.quest-name{font-size:14.5px; font-weight:600; line-height:1.3;}
.quest-item.done .quest-name{color:var(--ink-muted); text-decoration:line-through; text-decoration-color:var(--ink-faint);}
.quest-meta{display:flex; align-items:center; gap:9px; margin-top:3px; flex-wrap:wrap;}
.quest-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.streak-flag{display:flex; align-items:center; gap:3px; font-size:11.5px; font-weight:700; color:var(--ember); font-family:var(--font-mono);}
.task-add-row{display:flex; gap:8px; margin-top:2px;}
.task-add-row input{flex:1;}
.field-input{
  border:1px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 12px;
  font-size:13.5px; color:var(--ink); width:100%;
}
.field-input:focus{background:var(--surface); border-color:var(--accent);}
.completed-toggle{
  display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-muted);
  font-size:12.5px; font-weight:600; padding:8px 4px;
}

/* ---------- celebration ---------- */
.overlay{position:fixed; inset:0; background:rgba(15,16,20,0.5); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:300; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}
.celebrate-card{
  background:var(--surface); border-radius:26px; padding:38px 36px 30px; width:min(360px,88vw); text-align:center;
  box-shadow:var(--shadow-lg); border:1px solid var(--border); position:relative; overflow:hidden;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{opacity:0; transform:scale(.88) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);}}
.celebrate-glow{position:absolute; top:-90px; left:50%; transform:translateX(-50%); width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,var(--gold-soft),transparent 70%); opacity:.9;}
.celebrate-ring{width:66px; height:66px; border-radius:50%; background:linear-gradient(155deg,var(--gold),var(--ember)); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; position:relative; box-shadow:var(--shadow-md);}
.celebrate-card h3{font-size:21px; font-weight:700; position:relative;}
.celebrate-card p{color:var(--ink-2); font-size:13.5px; margin:7px 0 22px; position:relative;}
.celebrate-card .btn{width:100%; position:relative;}

/* ---------- toasts ---------- */
.toast-stack{position:fixed; top:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:10px;}
@media (max-width:860px){ .toast-stack{top:auto; bottom:78px; right:16px; left:16px;} }
.toast{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:13px 16px; box-shadow:var(--shadow-md); width:290px; max-width:100%; animation:toastin .35s cubic-bezier(.2,1,.3,1);
}
@keyframes toastin{ from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }
.toast-icon{width:36px; height:36px; border-radius:10px; background:var(--gold-soft); color:var(--gold-ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.toast-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gold);}
.toast-name{font-size:13.5px; font-weight:600;}
.toast-detail{font-size:11.5px; color:var(--ink-muted); margin-top:2px;}
.toast-levelup .toast-icon{background:linear-gradient(155deg,var(--gold),var(--ember)); color:#fff;}
.toast-levelup .toast-title{color:var(--ember);}

/* ---------- achievements ---------- */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:11px;}
.badge{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:15px 13px; background:var(--surface);
  display:flex; flex-direction:column; gap:8px; transition:opacity .2s ease;
}
.badge.locked{opacity:0.42;}
.badge-icon{width:38px; height:38px; border-radius:11px; background:linear-gradient(155deg,var(--gold),var(--ember)); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-sm);}
.badge.locked .badge-icon{background:var(--surface-2); color:var(--ink-muted); box-shadow:none;}
.badge-name{font-size:12.5px; font-weight:700;}
.badge-desc{font-size:11px; color:var(--ink-muted); line-height:1.35;}
.achv-strip{display:flex; gap:11px; overflow-x:auto; padding-bottom:2px;}
.achv-strip .badge{min-width:130px;}

/* ---------- progress page ---------- */
.stat-grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:13px;}
@media (max-width:940px){ .stat-grid5{grid-template-columns:repeat(3,1fr);} }
@media (max-width:600px){ .stat-grid5{grid-template-columns:repeat(2,1fr);} }
.range-switch{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px;}
.range-switch button{border:none; background:none; padding:6px 13px; border-radius:999px; font-size:12px; font-weight:600; color:var(--ink-muted);}
.range-switch button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.chart-tooltip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:11.5px; padding:7px 10px; border-radius:9px; font-family:var(--font-mono); box-shadow:var(--shadow-md); white-space:nowrap; z-index:10; transform:translate(-50%,-115%);}

.heatmap-scroll{overflow-x:auto; padding-bottom:4px;}
.heatmap-grid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); gap:3px;}
.heatmap-cell{width:13px; height:13px; border-radius:3.5px; background:var(--surface-2); border:1px solid var(--border);}
.heatmap-legend{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-muted); margin-top:10px; justify-content:flex-end;}
.heatmap-legend .heatmap-cell{width:11px; height:11px;}

.cat-bar-row{display:flex; align-items:center; gap:12px; padding:9px 0;}
.cat-bar-label{width:108px; flex-shrink:0; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px;}
.cat-bar-track{flex:1; height:10px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
.cat-bar-fill{height:100%; border-radius:999px;}
.cat-bar-value{width:64px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-2); flex-shrink:0;}

.level-timeline{display:flex; flex-direction:column;}
.level-tl-item{display:flex; align-items:center; gap:13px; padding:10px 0; border-bottom:1px solid var(--border);}
.level-tl-item:last-child{border-bottom:none;}
.level-tl-badge{width:34px; height:34px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; flex-shrink:0;}
.level-tl-date{font-size:12.5px; color:var(--ink-muted); font-family:var(--font-mono);}

.grid-2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px;}
@media (max-width:940px){ .grid-2{grid-template-columns:1fr;} }

/* ---------- routines page ---------- */
.routine-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.routine-group{margin-bottom:22px;}
.routine-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-md);
  background:var(--surface); border:1px solid var(--border); margin-bottom:8px;
}
.routine-row.paused{opacity:0.55;}
.drag-handle{cursor:grab; color:var(--ink-faint); flex-shrink:0; touch-action:none;}
.drag-handle:active{cursor:grabbing;}
.routine-row .r-name{font-size:14px; font-weight:600;}
.routine-row .r-meta{font-size:12px; color:var(--ink-muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap;}
.routine-row .r-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.switch{position:relative; width:36px; height:21px; border-radius:999px; background:var(--border-strong); border:none; flex-shrink:0; transition:background .15s ease;}
.switch.on{background:var(--accent);}
.switch-knob{position:absolute; top:2.5px; left:2.5px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s ease; box-shadow:var(--shadow-sm);}
.switch.on .switch-knob{transform:translateX(15px);}

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo, useCallback, Fragment} = React;

/* ================= dates & level math ================= */
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtD(new Date()); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function weekdayOf(s){ return parseD(s).getDay(); }
function niceDate(s){ return parseD(s).toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function greeting(){
  const h = new Date().getHours();
  if(h<5) return 'Good night';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Good night';
}
const WD_LABELS = ['S','M','T','W','T','F','S'];
const WD_FULL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function xpForLevel(level){ return 100 + (level-1)*20; }
function levelInfo(totalXP){
  let level=1, remaining=Math.max(0,totalXP);
  while(remaining >= xpForLevel(level)){ remaining -= xpForLevel(level); level++; }
  return {level, into:remaining, need:xpForLevel(level)};
}

/* ================= domain data ================= */
const CATEGORY_COLOR_VARS = ['--cat-learning','--cat-fitness','--cat-health','--cat-productivity','--cat-home','--cat-finance','--cat-personal'];
const DEFAULT_CATEGORIES = [
  {id:'health', name:'Health', colorVar:'--cat-health'},
  {id:'fitness', name:'Fitness', colorVar:'--cat-fitness'},
  {id:'learning', name:'Learning', colorVar:'--cat-learning'},

  {id:'home', name:'Home', colorVar:'--cat-home'},
  {id:'finance', name:'Finance', colorVar:'--cat-finance'},
  {id:'personal', name:'Personal', colorVar:'--cat-personal'},
];
const DIFFICULTY_PRESETS = [{label:'Easy',xp:10},{label:'Medium',xp:20},{label:'Hard',xp:40}];
const TIME_GROUPS = ['morning','afternoon','evening','anytime'];
const TIME_GROUP_LABELS = {morning:'Morning', afternoon:'Afternoon', evening:'Evening', anytime:'Anytime'};

const ACHIEVEMENTS = [
  {id:'first_day', name:'First Step', desc:'Complete your first Perfect Day', check:s=>s.daysCompletedCount>=1},
  {id:'streak_7', name:'Week One', desc:'Reach a 7-day Aura Streak', check:s=>s.longestStreak>=7},
  {id:'streak_30', name:'Full Month', desc:'Reach a 30-day Aura Streak', check:s=>s.longestStreak>=30},
  {id:'tasks_100', name:'Centurion', desc:'Complete 100 tasks', check:s=>s.tasksCompletedTotal>=100},
  {id:'xp_1000', name:'Grand', desc:'Reach 1,000 Total Aura', check:s=>s.totalXP>=1000},
  {id:'level_5', name:'Rising', desc:'Reach Aura Level 5', check:s=>s.level.level>=5},
  {id:'level_10', name:'Established', desc:'Reach Aura Level 10', check:s=>s.level.level>=10},
  {id:'level_25', name:'Veteran', desc:'Reach Aura Level 25', check:s=>s.level.level>=25},
  {id:'level_50', name:'Master', desc:'Reach Aura Level 50', check:s=>s.level.level>=50},
];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

function isRoutineDueOn(routine, dateStr){
  if(routine.paused) return false;
  if(routine.repeat.type==='daily') return true;
  return routine.repeat.days.includes(weekdayOf(dateStr));
}

function repeatSummary(routine){
  if(routine.repeat.type==='daily') return 'Every day';
  if(routine.repeat.days.length===7) return 'Every day';
  if(routine.repeat.days.length===0) return 'No days set';
  const sorted=[...routine.repeat.days].sort();
  return sorted.map(d=>WD_LABELS[d]).join(' ');
}

function formatExercises(exercises){
  return exercises.map(x=>x.reps+' '+x.name).join(', ');
}

function dayXP(day){
  const r = Object.values(day.routines||{}).reduce((s,v)=>s+v.xp,0);
  const t = Object.values(day.tasks||{}).reduce((s,v)=>s+v.xp,0);
  const b = day.bonus ? day.bonus.xp : 0;
  return r+t+b;
}

function computeStats(routines, tasks, history){
  const totalXP = history.reduce((s,h)=>s+dayXP(h),0);
  const tasksCompletedTotal = history.reduce((s,h)=> s+Object.keys(h.routines||{}).length+Object.keys(h.tasks||{}).length, 0);
  const completeDates = new Set(history.filter(h=>h.dailyComplete).map(h=>h.date));
  const today = todayStr();
  let cursor = completeDates.has(today) ? parseD(today) : parseD(addDays(today,-1));
  let currentStreak = 0;
  while(completeDates.has(fmtD(cursor))){ currentStreak++; cursor.setDate(cursor.getDate()-1); }
  const sortedDates = [...completeDates].sort();
  let longestStreak = 0, run = 0, prevDs = null;
  for(const ds of sortedDates){
    run = (prevDs && addDays(prevDs,1)===ds) ? run+1 : 1;
    longestStreak = Math.max(longestStreak, run);
    prevDs = ds;
  }
  const routineById = Object.fromEntries(routines.map(r=>[r.id,r]));
  const taskById = Object.fromEntries(tasks.map(t=>[t.id,t]));
  const categoryXP = {};
  history.forEach(h=>{
    Object.entries(h.routines||{}).forEach(([rid,rec])=>{
      const cat = routineById[rid] ? routineById[rid].categoryId : 'uncategorized';
      categoryXP[cat] = (categoryXP[cat]||0)+rec.xp;
    });
    Object.entries(h.tasks||{}).forEach(([tid,rec])=>{
      const cat = taskById[tid] ? taskById[tid].categoryId : 'uncategorized';
      categoryXP[cat] = (categoryXP[cat]||0)+rec.xp;
    });
  });
  return {
    totalXP, level:levelInfo(totalXP), tasksCompletedTotal, currentStreak, longestStreak,
    daysCompletedCount: completeDates.size, categoryXP, completeDates
  };
}

function routineStreak(routine, history){
  const doneDates = new Set(history.filter(h=>h.routines && h.routines[routine.id]).map(h=>h.date));
  const today = todayStr();
  let streak = 0, cur = today, guard = 0;
  while(guard < 3660){
    guard++;
    const due = isRoutineDueOn(routine, cur);
    if(due){
      if(cur===today && !doneDates.has(cur)){ /* today in progress, skip without breaking */ }
      else if(doneDates.has(cur)) streak++;
      else break;
    }
    cur = addDays(cur,-1);
  }
  return streak;
}

function computeLevelHistory(history){
  const sorted = [...history].sort((a,b)=> a.date<b.date?-1:1);
  let cum=0, events=[];
  for(const h of sorted){
    const before = levelInfo(cum).level;
    cum += dayXP(h);
    const after = levelInfo(cum).level;
    for(let L=before+1; L<=after; L++) events.push({level:L, date:h.date});
  }
  return events.reverse();
}

/* ================= storage ================= */
const LS_PREFIX = 'momentum_v1__';
let dbApi = null;
function lsGet(key, fallback){ try{ const raw=localStorage.getItem(LS_PREFIX+key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }
function lsSet(key, val){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){} }

async function initDb(){
  try{ if(window.claude && window.claude.use){ dbApi = await window.claude.use('db'); } }catch(e){ dbApi=null; }
}
async function loadCollection(name){
  if(dbApi){
    try{
      const snap = await dbApi.collection(name).limit(1000).get();
      const docs = snap.docs.map(d=>({id:d.id, ...d.data()}));
      lsSet('coll_'+name, docs);
      return docs;
    }catch(e){}
  }
  return lsGet('coll_'+name, []);
}
async function loadDoc(path){
  if(dbApi){
    try{
      const snap = await dbApi.doc(path).get();
      if(snap.exists){ const data=snap.data(); lsSet('doc_'+path, data); return data; }
      return null;
    }catch(e){}
  }
  return lsGet('doc_'+path, null);
}
function putCollDoc(name, doc){
  if(dbApi){ dbApi.collection(name).doc(doc.id).set(doc).catch(()=>{}); }
}
function removeCollDoc(name, id){
  if(dbApi){ dbApi.collection(name).doc(id).delete().catch(()=>{}); }
}
function putDoc(path, data){
  lsSet('doc_'+path, data);
  if(dbApi){ dbApi.doc(path).set(data).catch(()=>{}); }
}
function mirrorColl(name, arr){ lsSet('coll_'+name, arr); }

/* ================= seed ================= */
function buildSeed(){
  const mk = (name, categoryId, xp, timeOfDay, repeat, order) => ({
    id: uid(), name, categoryId, xp, timeOfDay, paused:false, order,
    repeat: repeat || {type:'daily'}
  });
  return [
    mk('Drink a glass of water', 'health', 10, 'morning', null, 0),
    mk('Move for 20 minutes', 'fitness', 20, 'morning', null, 1),
    mk('Read 10 pages', 'learning', 10, 'evening', null, 2),
    mk('Plan tomorrow', 'productivity', 10, 'evening', null, 3),
    mk('Tidy one space', 'home', 10, 'afternoon', {type:'weekdays', days:[1,3,5]}, 4),
  ];
}

function useTheme(){
  const [theme, setTheme] = useState(()=>lsGet('theme','system'));
  useEffect(()=>{
    if(theme==='system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    lsSet('theme', theme);
  },[theme]);
  return [theme, setTheme];
}

function catColor(categoryId, categories){
  const c = categories.find(c=>c.id===categoryId);
  return c ? `var(${c.colorVar})` : 'var(--ink-faint)';
}

/* ================= app ================= */
function App(){
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('today');
  const [theme, setTheme] = useTheme();
  const [routines, setRoutines] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [history, setHistory] = useState([]);
  const [meta, setMeta] = useState({achievementsUnlocked:{}, seeded:false, createdAt:Date.now()});
  const [celebration, setCelebration] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [xpFloats, setXpFloats] = useState([]);
  const [routineModal, setRoutineModal] = useState(null); // null | 'new' | routine object

  useEffect(()=>{ (async()=>{
    await initDb();
    let [rt, tk, ct, hs, mt] = await Promise.all([

      loadCollection('history'), loadDoc('meta/app')

    if(!mt.seeded){
      rt = buildSeed();
      rt.forEach(r=>putCollDoc('routines', r));
      mirrorColl('routines', rt);
      mt = {...mt, seeded:true};
      putDoc('meta/app', mt);
    }
    if(!mt.migrations?.strengthCircuit){
      const circuit = {
        id: uid(), name:'Strength Circuit', categoryId:'fitness', xp:40, timeOfDay:'anytime',
        paused:false, order: rt.length, repeat:{type:'daily'},
        exercises: [
          {id:uid(), name:'Push-ups', reps:25},
          {id:uid(), name:'Sit-ups', reps:25},
          {id:uid(), name:'Squats', reps:25},
          {id:uid(), name:'Pull-ups', reps:5},
        ],
        progression: {enabled:true, milestoneDays:15, increment:5, level:1, nextMilestone:15},
      };
      rt = [...rt, circuit];
      putCollDoc('routines', circuit);
      mirrorColl('routines', rt);
      mt = {...mt, migrations:{...(mt.migrations||{}), strengthCircuit:true}};
      putDoc('meta/app', mt);
    }
    if(!mt.migrations?.routineBatch2){
      const batch = [
        {id:uid(), name:'Wake Up 5:00 AM', categoryId:'health', xp:10, timeOfDay:'morning', paused:false, order:rt.length, repeat:{type:'daily'}},
        {id:uid(), name:'Make Bed', categoryId:'home', xp:10, timeOfDay:'morning', paused:false, order:rt.length+1, repeat:{type:'daily'}},
        {id:uid(), name:'Workout (5:30-6:30)', categoryId:'fitness', xp:40, timeOfDay:'morning', paused:false, order:rt.length+2, repeat:{type:'daily'}},
        {id:uid(), name:'Work Shift (7:00-3:00)', categoryId:'productivity', xp:20, timeOfDay:'afternoon', paused:false, order:rt.length+3, repeat:{type:'weekdays', days:[1,2,3,4,5]}},
        {id:uid(), name:'Study for CFA (1 hr)', categoryId:'learning', xp:40, timeOfDay:'evening', paused:false, order:rt.length+4, repeat:{type:'daily'}},
      ];
      rt = [...rt, ...batch];

      mirrorColl('routines', rt);

    setRoutines(rt); setTasks(tk); setCategories(allCats); setHistory(hs); setMeta(mt);
    setLoading(false);
  })(); },[]);

  const stats = useMemo(()=>computeStats(routines, tasks, history), [routines, tasks, history]);

  const dueToday = useMemo(()=> routines.filter(r=>isRoutineDueOn(r, today)).sort((a,b)=>a.order-b.order), [routines, today]);

    else { day.routines[routine.id] = {xp:routine.xp, completedAt:Date.now()}; xpDelta += routine.xp; }

    const allDue = routines.filter(r=>isRoutineDueOn(r, today));
    const allDone = allDue.length>0 && allDue.every(r=>day.routines[r.id]);
    let justCompleted = false;
    if(allDone && !day.dailyComplete){
      const sum = allDue.reduce((s,r)=>s+day.routines[r.id].xp,0);
      const bonus = Math.max(20, Math.round(sum*0.3));
      day.bonus = {xp:bonus, awardedAt:Date.now()};
      day.dailyComplete = true;
      xpDelta += bonus;
      justCompleted = true;
    } else if(!allDone && day.dailyComplete){
      xpDelta -= (day.bonus ? day.bonus.xp : 0);
      day.bonus = null;
      day.dailyComplete = false;
    }
    const newHistory = persistDay(day);
    if(ev && xpDelta>0){ const r=ev.currentTarget.getBoundingClientRect(); pushXpFloat(xpDelta, r.left+r.width/2, r.top); }
    if(!alreadyDone && routine.progression?.enabled){
      const newRoutineStreak = routineStreak(routine, newHistory);
      if(newRoutineStreak >= routine.progression.nextMilestone){
        const bumpedExercises = routine.exercises.map(x=>({...x, reps:x.reps+routine.progression.increment}));
        const newLevel = routine.progression.level+1;
        const newProgression = {...routine.progression, level:newLevel, nextMilestone:routine.progression.nextMilestone+routine.progression.milestoneDays};
        updateRoutine(routine.id, {exercises:bumpedExercises, progression:newProgression});
        pushToast({kind:'exlevelup', name:routine.name+' - Level '+newLevel, detail:formatExercises(bumpedExercises)});
      }
    }
    const newStats = computeStats(routines, tasks, newHistory);
    if(justCompleted) setCelebration({bonus: day.bonus.xp, streak: newStats.currentStreak});
    checkLevelUp(newStats);
    await checkAchievements(newStats);
  }

  async function toggleTaskDone(task, ev){
    const day = {...todayDoc, routines:{...todayDoc.routines}, tasks:{...todayDoc.tasks}};
    let newTasks;
    if(task.completed){
      newTasks = tasks.map(t=>t.id===task.id?{...t, completed:false, completedAt:null}:t);
      delete day.tasks[task.id];
    } else {
      newTasks = tasks.map(t=>t.id===task.id?{...t, completed:true, completedAt:Date.now()}:t);
      day.tasks[task.id] = {xp:task.xp, completedAt:Date.now()};
      if(ev){ const r=ev.currentTarget.getBoundingClientRect(); pushXpFloat(task.xp, r.left+r.width/2, r.top); }
    }
    setTasks(newTasks);
    putCollDoc('tasks', newTasks.find(t=>t.id===task.id));
    mirrorColl('tasks', newTasks);
    const newHistory = persistDay(day);
    const newStats = computeStats(routines, newTasks, newHistory);
    checkLevelUp(newStats);
    await checkAchievements(newStats);
  }

  function addTask(name, categoryId, xp){
    const t = {id:uid(), name, categoryId, xp, completed:false, createdAt:Date.now()};
    const newTasks = [...tasks, t];
    setTasks(newTasks);
    putCollDoc('tasks', t);
    mirrorColl('tasks', newTasks);
  }
  function deleteTask(id){
    const newTasks = tasks.filter(t=>t.id!==id);
    setTasks(newTasks);
    removeCollDoc('tasks', id);
    mirrorColl('tasks', newTasks);
  }

  function saveRoutine(data){
    if(data.id){
      setRoutines(rs=>{
        const merged = rs.map(r=>r.id===data.id?{...r,...data}:r);
        putCollDoc('routines', merged.find(r=>r.id===data.id));
        mirrorColl('routines', merged);
        return merged;
      });
    } else {
      const r = {...data, id:uid(), order: routines.length};
      setRoutines(rs=>{
        const merged = [...rs, r];
        putCollDoc('routines', r);
        mirrorColl('routines', merged);
        return merged;
      });
    }
    setRoutineModal(null);
  }
  function deleteRoutine(id){
    const newRoutines = routines.filter(r=>r.id!==id);
    setRoutines(newRoutines);
    removeCollDoc('routines', id);
    mirrorColl('routines', newRoutines);
  }
  function updateRoutine(id, patch){
    setRoutines(rs=>{
      const merged = rs.map(r=>r.id===id?{...r,...patch}:r);
      putCollDoc('routines', merged.find(r=>r.id===id));
      mirrorColl('routines', merged);
      return merged;
    });
  }
  function reorderRoutines(newList){
    const withOrder = newList.map((r,i)=>({...r, order:i}));
    setRoutines(rs => {
      const others = rs.filter(r=>!newList.some(n=>n.id===r.id));
      const merged = [...others, ...withOrder];
      withOrder.forEach(r=>putCollDoc('routines', r));
      mirrorColl('routines', merged);
      return merged;
    });
  }
  function addCategory(name, colorVar){
    const c = {id:uid(), name, colorVar};
    const newCats = [...categories, c];
    setCategories(newCats);
    putCollDoc('categories', c);
    mirrorColl('categories', newCats.filter(c=>!DEFAULT_CATEGORIES.some(d=>d.id===c.id)));
    return c;
  }

  if(loading){
    return <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--ink-muted)', fontFamily:'var(--font-body)'}}>Loading Aura Farming 101...</div>;
  }

  const navItems = [
    {id:'today', label:'Today', icon:'home'},
    {id:'progress', label:'Journey', icon:'chart'},
    {id:'routines', label:'Routines', icon:'list'},
  ];

  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="brand"><div className="brand-mark"></div><div className="brand-name">Aura</div></div>
        {navItems.map(n=>(
          <button key={n.id} className={'nav-item'+(page===n.id?' active':'')} onClick={()=>setPage(n.id)}>
            <Icon name={n.icon} size={18}/>{n.label}
          </button>
        ))}
        <div className="sidebar-footer">
          <div className="theme-switch">
            <button className={theme==='light'?'active':''} onClick={()=>setTheme('light')} aria-label="Light"><Icon name="sun" size={14}/></button>
            <button className={theme==='system'?'active':''} onClick={()=>setTheme('system')} aria-label="System"><Icon name="laptop" size={14}/></button>
            <button className={theme==='dark'?'active':''} onClick={()=>setTheme('dark')} aria-label="Dark"><Icon name="moon" size={14}/></button>
          </div>
        </div>
      </aside>

      <main className="main">
        {page==='today' && <TodayPage {...{routines, tasks, categories, history, todayDoc, dueToday, pendingTasks, stats, meta, toggleRoutine, toggleTaskDone, addTask, deleteTask, today}}/>}
        {page==='progress' && <ProgressPage {...{routines, tasks, categories, history, stats, meta}}/>}
        {page==='routines' && <RoutinesPage {...{routines, categories, setRoutineModal, deleteRoutine, reorderRoutines, updateRoutine, saveRoutine}} routineModal={routineModal} onEdit={r=>setRoutineModal(r)} onNew={()=>setRoutineModal('new')} onClose={()=>setRoutineModal(null)} addCategory={addCategory}/>}
      </main>

      <nav className="bottom-nav">
        {navItems.map(n=>(
          <button key={n.id} className={page===n.id?'active':''} onClick={()=>setPage(n.id)}>
            <Icon name={n.icon} size={20}/>{n.label}
          </button>
        ))}
      </nav>

      {xpFloats.map(f=>(
        <div key={f.id} className="xp-float" style={{left:f.x, top:f.y}}>
          <div className="xp-float-amt">+{f.amount} XP</div>
          <div className="xp-float-sub">Aura increased</div>
        </div>
      ))}

      {celebration && (
        <div className="overlay" onClick={()=>setCelebration(null)}>
          <div className="celebrate-card" onClick={e=>e.stopPropagation()}>
            <div className="celebrate-glow"></div>
            <div className="celebrate-ring"><Icon name="check" size={30} stroke="#fff"/></div>
            <h3>Perfect Day</h3>
            <p>+{celebration.bonus} bonus XP - {celebration.streak}-day Aura Streak</p>
            <button className="btn btn-primary" onClick={()=>setCelebration(null)}>Nice</button>
          </div>
        </div>
      )}

      <div className="toast-stack">
        {toasts.map(t=>(
          <div key={t.id} className={'toast'+(t.kind==='levelup'||t.kind==='exlevelup'?' toast-levelup':'')}>
            <div className="toast-icon"><Icon name={t.kind==='levelup'?'flame':t.kind==='exlevelup'?'trending':'award'} size={18}/></div>
            <div>
              <div className="toast-title">{t.kind==='levelup'?'Level Up':t.kind==='exlevelup'?'Routine Level Up':'Achievement unlocked'}</div>
              <div className="toast-name">{t.name}</div>
              {t.detail && <div className="toast-detail">{t.detail}</div>}
            </div>
          </div>
        ))}
      </div>

      {routineModal && (
        <RoutineFormModal
          routine={routineModal==='new'?null:routineModal}
          categories={categories}
          addCategory={addCategory}
          onSave={saveRoutine}
          onClose={()=>setRoutineModal(null)}
        />
      )}
    </div>
  );
}

  const [range, setRange] = useState(30);

  const days = useMemo(()=>{
    const byDate = Object.fromEntries(history.map(h=>[h.date,h]));
    return Array.from({length:range},(_,i)=>{
      const d = addDays(today, -(range-1-i));
      const h = byDate[d];
      return {date:d, xp: h?dayXP(h):0, complete: h?!!h.dailyComplete:false};
    });
  },[history, range, today]);

  const heatDays = useMemo(()=>{
    const byDate = Object.fromEntries(history.map(h=>[h.date,h]));
    const N=126;
    return Array.from({length:N},(_,i)=>{
      const d = addDays(today, -(N-1-i));
      const h = byDate[d];
      const xp = h?dayXP(h):0;
      return {date:d, xp, complete: h?!!h.dailyComplete:false};
    });
  },[history, today]);

  const levelHistory = useMemo(()=>computeLevelHistory(history), [history]);
  const catEntries = Object.entries(stats.categoryXP).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

        <StatBox label="Tasks Done" value={stats.tasksCompletedTotal}/>

        <h2>XP Over Time</h2>

          {[30,90,365].map(r=>(
            <button key={r} className={range===r?'active':''} onClick={()=>setRange(r)}>{r===365?'1y':r+'d'}</button>

      <div className="section-head"><h2>Consistency</h2><span className="sub">last 18 weeks</span></div>
      <div className="card card-pad">
        <Heatmap days={heatDays}/>
        <div className="heatmap-legend">
          Less
          <div className="heatmap-cell" style={{background:'var(--surface-2)'}}></div>
          <div className="heatmap-cell" style={{background:'var(--gold-soft)'}}></div>
          <div className="heatmap-cell" style={{background:'var(--gold)'}}></div>
          <div className="heatmap-cell" style={{background:'var(--ember)'}}></div>
          More
        </div>
      </div>

      <div className="grid-2">
        <div>
          <div className="section-head"><h2>By Category</h2></div>
          <div className="card card-pad">
            {catEntries.length===0 && <div className="empty">Complete some quests to see your breakdown.</div>}
            {catEntries.map(([catId,xp])=>{
              const cat = categories.find(c=>c.id===catId);
              const color = cat ? `var(${cat.colorVar})` : 'var(--ink-faint)';
              return (
                <div key={catId} className="cat-bar-row">
                  <div className="cat-bar-label"><span className="dot" style={{background:color}}></span>{cat?cat.name:'Other'}</div>
                  <div className="cat-bar-track"><div className="cat-bar-fill" style={{width:(xp/maxCat*100)+'%', background:color}}></div></div>
                  <div className="cat-bar-value">{xp.toLocaleString()} XP</div>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div className="section-head"><h2>Aura Level History</h2></div>
          <div className="card card-pad" style={{maxHeight:320, overflowY:'auto'}}>
            {levelHistory.length===0 && <div className="empty">No level-ups yet.</div>}
            <div className="level-timeline">
              {levelHistory.map(e=>(
                <div key={e.level} className="level-tl-item">
                  <div className="level-tl-badge">{e.level}</div>
                  <div><div style={{fontSize:13.5, fontWeight:600}}>Reached Aura Level {e.level}</div><div className="level-tl-date">{niceDate(e.date)}</div></div>
                </div>
              ))}

          const unlocked = !!meta.achievementsUnlocked[a.id];
          return (
            <div key={a.id} className={'badge'+(unlocked?'':' locked')}>
              <div className="badge-icon"><Icon name={unlocked?'award':'lock'} size={17} stroke={unlocked?'#fff':'currentColor'}/></div>
              <div className="badge-name">{a.name}</div>
              <div className="badge-desc">{a.desc}</div>

function StatBox({label, value}){
  return <div className="card stat-tile"><span className="stat-tile-label">{label}</span><div className="stat-tile-value mono">{value}</div></div>;
}

function XPChart({days}){
  const W=760, H=190, padL=6, padR=6, padT=14, padB=24;
  const [hover, setHover] = useState(null);
  const max = Math.max(10, ...days.map(d=>d.xp));
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const stepX = days.length>1 ? innerW/(days.length-1) : 0;
  const pts = days.map((d,i)=>({x:padL+i*stepX, y:padT+innerH-(d.xp/max*innerH), ...d}));
  const line = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1].x.toFixed(1)},${padT+innerH} L${pts[0].x.toFixed(1)},${padT+innerH} Z`;
  const tickIdx = days.length>60 ? [0, Math.floor(days.length/2), days.length-1] : [0, Math.floor(days.length/4), Math.floor(days.length/2), Math.floor(days.length*3/4), days.length-1];
  return (
    <div style={{position:'relative'}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height:'auto', overflow:'visible'}}>
        <defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--gold)" stopOpacity="0.32"/><stop offset="100%" stopColor="var(--gold)" stopOpacity="0"/>
        </linearGradient></defs>
        {[0.25,0.5,0.75].map(f=>(<line key={f} x1={padL} x2={W-padR} y1={padT+innerH*f} y2={padT+innerH*f} stroke="var(--border)" strokeWidth="1"/>))}
        <path d={area} fill="url(#areaFill)"/>
        <path d={line} fill="none" stroke="var(--gold)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {hover!=null && <line x1={pts[hover].x} x2={pts[hover].x} y1={padT} y2={padT+innerH} stroke="var(--ink-faint)" strokeWidth="1"/>}
        {hover!=null && <circle cx={pts[hover].x} cy={pts[hover].y} r="4" fill="var(--gold)" stroke="var(--surface)" strokeWidth="2"/>}
        {tickIdx.map(i=>(<text key={i} x={pts[i].x} y={H-4} fontSize="9.5" fill="var(--ink-muted)" fontFamily="var(--font-mono)" textAnchor="middle">{niceDate(pts[i].date)}</text>))}
        <rect x={padL} y={padT} width={innerW} height={innerH} fill="transparent"
          onMouseMove={e=>{ const r=e.currentTarget.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*innerW; const idx=Math.round(x/stepX); setHover(Math.max(0,Math.min(days.length-1,idx))); }}
          onMouseLeave={()=>setHover(null)}/>
      </svg>
      {hover!=null && (
        <div className="chart-tooltip" style={{left:(pts[hover].x/W*100)+'%', top:(pts[hover].y/H*100)+'%'}}>
          {niceDate(pts[hover].date)} - {pts[hover].xp} XP
        </div>
      )}
    </div>
  );
}

function Heatmap({days}){
  const [hover, setHover] = useState(null);
  const firstWd = weekdayOf(days[0].date);
  const cells = [...Array(firstWd).fill(null), ...days];
  function colorFor(d){
    if(!d) return 'transparent';
    if(d.complete) return 'var(--ember)';
    if(d.xp>=30) return 'var(--gold)';
    if(d.xp>0) return 'var(--gold-soft)';
    return 'var(--surface-2)';
  }
  return (
    <div className="heatmap-scroll" style={{position:'relative'}}>
      <div className="heatmap-grid">
        {cells.map((d,i)=>(
          <div key={i} className="heatmap-cell" style={{background:colorFor(d), borderColor:d?'var(--border)':'transparent', cursor:d?'pointer':'default'}}
            onMouseEnter={()=>d&&setHover({...d, i})} onMouseLeave={()=>setHover(null)}></div>
        ))}
      </div>
      {hover && <div className="chart-tooltip" style={{left:(hover.i%(Math.ceil(cells.length/7)))*16+6, top:-6, position:'absolute'}}>{niceDate(hover.date)} - {hover.xp} XP</div>}
    </div>
  );
}

/* ================= Routines page ================= */
function RoutinesPage({routines, categories, deleteRoutine, reorderRoutines, updateRoutine, onEdit, onNew, addCategory}){
  const [confirmId, setConfirmId] = useState(null);
  const dragItem = useRef(null);

  const grouped = TIME_GROUPS.map(g=>({key:g, items: routines.filter(r=>(r.timeOfDay||'anytime')===g).sort((a,b)=>a.order-b.order)}));

  function onDragStart(id){ dragItem.current = id; }
  function onDragOver(e, overId, groupItems){ e.preventDefault(); }
  function onDrop(groupItems, overId){
    const fromId = dragItem.current;
    if(!fromId || fromId===overId) return;
    const list = [...groupItems];
    const fromIdx = list.findIndex(r=>r.id===fromId);
    const toIdx = list.findIndex(r=>r.id===overId);
    if(fromIdx<0||toIdx<0) return;
    const [moved] = list.splice(fromIdx,1);
    list.splice(toIdx,0,moved);
    reorderRoutines(list);
    dragItem.current = null;
  }

  return (
    <Fragment>
      <div className="page-head"><h1>Routines</h1><p>Manage your recurring habits.</p></div>
      <div className="routine-toolbar">
        <div className="sub mono" style={{color:'var(--ink-muted)', fontSize:12.5}}>{routines.length} routine{routines.length!==1?'s':''}</div>
        <button className="btn btn-primary" onClick={onNew}><Icon name="plus" size={15}/>New Routine</button>
      </div>

      {routines.length===0 && <div className="card empty"><Icon name="list" size={26}/><div>No routines yet. Create your first one to start building quests.</div></div>}

      {grouped.filter(g=>g.items.length).map(g=>(
        <div key={g.key} className="routine-group">
          <div className="group-label">{TIME_GROUP_LABELS[g.key]}</div>
          {g.items.map(r=>{
            const cat = categories.find(c=>c.id===r.categoryId);
            const color = cat?`var(${cat.colorVar})`:'var(--ink-faint)';
            return (
              <div key={r.id} className={'routine-row'+(r.paused?' paused':'')}
                draggable onDragStart={()=>onDragStart(r.id)} onDragOver={e=>onDragOver(e,r.id,g.items)} onDrop={()=>onDrop(g.items,r.id)}>
                <span className="drag-handle"><Icon name="grip" size={16}/></span>
                <span className="dot" style={{background:color}}></span>
                <div style={{flex:1, minWidth:0}}>
                  <div className="r-name">{r.name}{r.progression?.enabled && <span className="level-chip" style={{marginLeft:8}}>Lv {r.progression.level}</span>}</div>
                  <div className="r-meta">
                    <span>{cat?cat.name:'Uncategorized'}</span><span>-</span><span>{repeatSummary(r)}</span><span>-</span><span className="mono">{r.xp} XP</span>
                    {r.paused && <Fragment><span>-</span><span style={{color:'var(--ember)', fontWeight:600}}>Paused</span></Fragment>}
                  </div>
                  {r.exercises?.length>0 && <div className="exercise-line">{formatExercises(r.exercises)}{r.progression?.enabled && (' - +'+r.progression.increment+' reps every '+r.progression.milestoneDays+'d streak')}</div>}
                </div>
                <div className="r-actions">
                  <button className={'switch'+(!r.paused?' on':'')} onClick={()=>updateRoutine(r.id, {paused:!r.paused})} aria-label="Toggle active" title={r.paused?'Resume':'Pause'}>
                    <span className="switch-knob"></span>
                  </button>
                  <button className="icon-btn" onClick={()=>onEdit(r)} aria-label="Edit"><Icon name="pencil" size={15}/></button>
                  {confirmId===r.id ? (
                    <button className="btn btn-danger btn-sm" onClick={()=>{deleteRoutine(r.id); setConfirmId(null);}}>Confirm</button>
                  ) : (
                    <button className="icon-btn" onClick={()=>setConfirmId(r.id)} aria-label="Delete"><Icon name="trash" size={15}/></button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </Fragment>
  );
}

function RoutineFormModal({routine, categories, addCategory, onSave, onClose}){
  const isEdit = !!routine;
  const [name, setName] = useState(routine?.name || '');
  const [categoryId, setCategoryId] = useState(routine?.categoryId || categories[0].id);
  const [xp, setXp] = useState(routine?.xp || 20);
  const [repeatType, setRepeatType] = useState(routine?.repeat?.type || 'daily');
  const [days, setDays] = useState(routine?.repeat?.days || [1,2,3,4,5]);
  const [timeOfDay, setTimeOfDay] = useState(routine?.timeOfDay || 'anytime');
  const [newCatName, setNewCatName] = useState('');
  const [newCatColor, setNewCatColor] = useState(CATEGORY_COLOR_VARS[0]);
  const [showNewCat, setShowNewCat] = useState(false);
  const [exercises, setExercises] = useState(routine?.exercises ? routine.exercises.map(x=>({...x})) : []);
  const [progressionEnabled, setProgressionEnabled] = useState(routine?.progression?.enabled ?? false);
  const [milestoneDays, setMilestoneDays] = useState(routine?.progression?.milestoneDays || 15);
  const [increment, setIncrement] = useState(routine?.progression?.increment || 5);

  function toggleDay(d){ setDays(ds=> ds.includes(d) ? ds.filter(x=>x!==d) : [...ds,d].sort()); }
  function addExerciseRow(){ setExercises(ex=>[...ex, {id:uid(), name:'', reps:10}]); setProgressionEnabled(true); }
  function updateExerciseRow(id, patch){ setExercises(ex=>ex.map(x=>x.id===id?{...x,...patch}:x)); }
  function removeExerciseRow(id){ setExercises(ex=>ex.filter(x=>x.id!==id)); }

  function submit(e){
    e.preventDefault();
    if(!name.trim()) return;
    const cleanExercises = exercises.filter(x=>x.name.trim()).map(x=>({id:x.id, name:x.name.trim(), reps:Math.max(1, Number(x.reps)||1)}));
    const existingProg = routine?.progression;
    const md = Math.max(1, Number(milestoneDays)||15);
    const inc = Math.max(1, Number(increment)||5);
    onSave({
      id: routine?.id, name: name.trim(), categoryId, xp: Number(xp)||10,
      timeOfDay, paused: routine?.paused || false,
      repeat: repeatType==='daily' ? {type:'daily'} : {type:'weekdays', days},
      exercises: cleanExercises.length ? cleanExercises : undefined,
      progression: (cleanExercises.length && progressionEnabled) ? {
        enabled:true, milestoneDays:md, increment:inc,
        level: existingProg?.level || 1,
        nextMilestone: existingProg?.nextMilestone || md,
      } : undefined,
    });
  }
  function submitNewCat(){
    if(!newCatName.trim()) return;
    const c = addCategory(newCatName.trim(), newCatColor);
    setCategoryId(c.id); setShowNewCat(false); setNewCatName('');
  }

  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal-panel" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><h3>{isEdit?'Edit Routine':'New Routine'}</h3><button className="icon-btn" onClick={onClose}><Icon name="x" size={17}/></button></div>
        <form onSubmit={submit}>
          <div className="modal-body">
            <div className="field">
              <label>Name</label>
              <input className="field-input" autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Morning stretch"/>
            </div>

            <div className="field">
              <label>Category</label>
              <div className="cat-select-row">
                {categories.map(c=>(
                  <button type="button" key={c.id} className={'cat-pill'+(categoryId===c.id?' active':'')} onClick={()=>setCategoryId(c.id)}>
                    <span className="dot" style={{background:`var(${c.colorVar})`}}></span>{c.name}
                  </button>
                ))}
                <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setShowNewCat(s=>!s)}><Icon name="plus" size={13}/>New</button>
              </div>
              {showNewCat && (
                <div style={{marginTop:10, display:'flex', flexDirection:'column', gap:10}}>
                  <input className="field-input" placeholder="Category name" value={newCatName} onChange={e=>setNewCatName(e.target.value)}/>
                  <div className="swatch-row">
                    {CATEGORY_COLOR_VARS.map(v=>(
                      <button type="button" key={v} className={'swatch'+(newCatColor===v?' active':'')} style={{background:`var(${v})`}} onClick={()=>setNewCatColor(v)}></button>
                    ))}
                  </div>
                  <button type="button" className="btn btn-primary btn-sm" style={{alignSelf:'flex-start'}} onClick={submitNewCat}>Add category</button>
                </div>
              )}
            </div>

            <div className="field">
              <label>Exercises (optional)</label>
              <div className="exercise-list">
                {exercises.map(x=>(
                  <div key={x.id} className="exercise-row">
                    <input className="field-input" placeholder="Exercise name" value={x.name} onChange={e=>updateExerciseRow(x.id,{name:e.target.value})}/>
                    <input className="field-input mono exercise-reps" type="number" min="1" max="999" value={x.reps} onChange={e=>updateExerciseRow(x.id,{reps:e.target.value})}/>
                    <button type="button" className="icon-btn" onClick={()=>removeExerciseRow(x.id)} aria-label="Remove exercise"><Icon name="x" size={15}/></button>
                  </div>
                ))}
              </div>
              <button type="button" className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={addExerciseRow}><Icon name="plus" size={13}/>Add exercise</button>

              {exercises.length>0 && (
                <div className="progression-box">
                  <div className="progression-head">
                    <div>
                      <div className="progression-title">Auto-progression</div>
                      <div className="progression-sub">Add reps automatically after a streak milestone</div>
                    </div>
                    <button type="button" className={'switch'+(progressionEnabled?' on':'')} onClick={()=>setProgressionEnabled(p=>!p)} aria-label="Toggle auto-progression"><span className="switch-knob"></span></button>
                  </div>
                  {progressionEnabled && (
                    <div className="progression-fields">
                      <div className="field">
                        <label>Every N-day streak</label>
                        <input className="field-input mono" type="number" min="1" max="365" value={milestoneDays} onChange={e=>setMilestoneDays(e.target.value)}/>
                      </div>
                      <div className="field">
                        <label>Add reps</label>
                        <input className="field-input mono" type="number" min="1" max="100" value={increment} onChange={e=>setIncrement(e.target.value)}/>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="field">
              <label>Difficulty & XP</label>
              <div className="xp-input-row">
                <div className="segmented">
                  {DIFFICULTY_PRESETS.map(p=>(
                    <button type="button" key={p.label} className={'seg-btn'+(Number(xp)===p.xp?' active':'')} onClick={()=>setXp(p.xp)}>{p.label} - {p.xp}</button>
                  ))}
                </div>
                <input className="field-input mono" type="number" min="1" max="200" value={xp} onChange={e=>setXp(e.target.value)}/>
              </div>
            </div>

            <div className="field">
              <label>Repeat</label>
              <div className="segmented">
                <button type="button" className={'seg-btn'+(repeatType==='daily'?' active':'')} onClick={()=>setRepeatType('daily')}>Every day</button>
                <button type="button" className={'seg-btn'+(repeatType==='weekdays'?' active':'')} onClick={()=>setRepeatType('weekdays')}>Specific days</button>
              </div>
              {repeatType==='weekdays' && (
                <div className="day-chips" style={{marginTop:8}}>
                  {WD_LABELS.map((l,i)=>(
                    <button type="button" key={i} className={'day-chip'+(days.includes(i)?' active':'')} onClick={()=>toggleDay(i)} title={WD_FULL[i]}>{l}</button>
                  ))}
                </div>
              )}
            </div>

            <div className="field">
              <label>Time of day</label>
              <div className="segmented">
                {TIME_GROUPS.map(g=>(
                  <button type="button" key={g} className={'seg-btn'+(timeOfDay===g?' active':'')} onClick={()=>setTimeOfDay(g)}>{TIME_GROUP_LABELS[g]}</button>
                ))}
              </div>
            </div>
          </div>
          <div className="modal-foot">
            <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn btn-primary">{isEdit?'Save changes':'Create routine'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
